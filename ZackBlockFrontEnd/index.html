<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockly for C# Developers-Zack Yang</title>
  <link rel="stylesheet" href="https://code.getmdl.io/1.2.1/material.indigo-pink.min.css">
  <script src="./layui/layui.js"></script>
  <link rel="stylesheet" href="./layui/css/layui.css">
</head>

<body>
    <div class="blockly-editor" id="blocklyEditor" style="float:left;height: 100vh; width: 50vw;">
      <div id="blocklyDiv" style="height: 100%; width: 100%;"></div>
    </div>
	<div style="float:left;margin-left:10px;height: 100vh;width: 46vw;overflow-x: scroll;">
		<input id="btnExecute" type="button" value="Run"/>
		<input id="btnNew" type="button" value="New" />
		<input type="button" id="btnOpen" value="Open"/>
		<input id="btnSave" type="button" value="Save As" /> 
		<input id="btnCopyCode" type="button" value="Copy Code" />
		<input type="file" id="fileLoadFrom" name="upload" style="display:none"/>
		<pre id="code">
		</pre>	
   </div>	

  <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox-categories" style="display: none">
    <category name="Logic" categorystyle="logic_category">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
      <block type="logic_null"></block>
      <block type="logic_ternary"></block>
    </category>
    <category name="Loops" categorystyle="loop_category">
      <block type="controls_repeat_ext">
        <value name="TIMES">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
      </block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for">
        <value name="FROM">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="TO">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
        <value name="BY">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="controls_flow_statements"></block>
    </category>
    <category name="Math" categorystyle="math_category">
      <block type="math_number" gap="32">
        <field name="NUM">123</field>
      </block>
      <block type="math_arithmetic">
        <value name="A">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="B">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="IncOp">
	  </block>
      <block type="DecOp">
	  </block>	  
	  <block type="math_single">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">9</field>
          </shadow>
        </value>
      </block>
      <block type="math_trig">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">45</field>
          </shadow>
        </value>
      </block>
      <block type="math_constant"></block>
      <block type="math_number_property">
        <value name="NUMBER_TO_CHECK">
          <shadow type="math_number">
            <field name="NUM">0</field>
          </shadow>
        </value>
      </block>
      <block type="math_round">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">3.1</field>
          </shadow>
        </value>
      </block>
      <block type="math_modulo">
        <value name="DIVIDEND">
          <shadow type="math_number">
            <field name="NUM">64</field>
          </shadow>
        </value>
        <value name="DIVISOR">
          <shadow type="math_number">
            <field name="NUM">10</field>
          </shadow>
        </value>
      </block>
      <block type="math_constrain">
        <value name="VALUE">
          <shadow type="math_number">
            <field name="NUM">50</field>
          </shadow>
        </value>
        <value name="LOW">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="HIGH">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
      </block>
      <block type="math_random_int">
        <value name="FROM">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
        <value name="TO">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
      </block>
      <block type="math_random_float"></block>
    </category>
    <category name="Text" categorystyle="text_category">
      <block type="text_print">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
	  <block kind="block" type="readLine"></block>
      <block type="text"></block>
      <block type="text_multiline"></block>
      <label text="String function:" web-class="ioLabel"></label>	  	  
      <block type="text_join"></block>
      <block type="text_append">
        <value name="TEXT">
          <shadow type="text"></shadow>
        </value>
      </block>
      <block type="text_length">
        <value name="VALUE">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_isEmpty">
        <value name="VALUE">
          <shadow type="text">
            <field name="TEXT"></field>
          </shadow>
        </value>
      </block>
      <block type="text_indexOf">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
        <value name="FIND">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_charAt">
        <value name="VALUE">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
      </block>
      <block type="text_getSubstring">
        <value name="STRING">
          <block type="variables_get">
            <field name="VAR">text</field>
          </block>
        </value>
      </block>
      <block type="text_changeCase">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>
      <block type="text_trim">
        <value name="TEXT">
          <shadow type="text">
            <field name="TEXT">abc</field>
          </shadow>
        </value>
      </block>  
    </category>
    <category name="Variables" categorystyle="variable_category" custom="VARIABLE">
	</category>
	<category name="Advance" categorystyle="colour_category">
	    <block kind="block" type="DefVarType"></block>
		<block kind="block" type="convert"></block>
		<block kind="block" type="CastAs"></block>
		<block kind="block" type="SingleLineComment"></block>
		<block kind="block" type="MultiLineComment"></block>
    </category>	
    <sep></sep>	
	<category name="DateTime" categorystyle="colour_category">
		<block kind="block" type="now"></block>
		<block kind="block" type="today"></block>
		<block kind="block" type="get_datetime_part"></block>
		<block kind="block" type="create_datetime_from"></block>
		<block kind="block" type="create_date_from"></block>
    </category>
	<category name="Game Text" categorystyle="colour_category">
		<block kind="block" type="createText"></block>
		<block kind="block" type="setTextPosition"></block>
		<block kind="block" type="setText"></block>
		<block kind="block" type="setTextColor"></block>
		<block kind="block" type="setTextFont"></block>
		<block kind="block" type="showText"></block>		
		<block kind="block" type="hideText"></block>
    </category>	
	<category name="Game Image" categorystyle="colour_category">
		<block kind="block" type="createImage"></block>
		<block kind="block" type="setImagePosition"></block>
		<block kind="block" type="setImageURL"></block>
		<block kind="block" type="showImage"></block>		
		<block kind="block" type="hideImage"></block>
    </category>	
	<category name="Game Sprite" categorystyle="colour_category">
		<block kind="block" type="createSprite"></block>
		<block kind="block" type="setSpritePosition"></block>
		<block kind="block" type="playSpriteAnimation"></block>
		<block kind="block" type="setSpriteXFlipped"></block>
		<block kind="block" type="setSpriteYFlipped"></block>
		<block kind="block" type="showSprite"></block>		
		<block kind="block" type="hideSprite"></block>
    </category>	
    <category name="Colour" categorystyle="colour_category">
      <block type="colour_picker"></block>
      <block type="colour_random"></block>
      <block type="colour_rgb">
        <value name="RED">
          <shadow type="math_number">
            <field name="NUM">100</field>
          </shadow>
        </value>
        <value name="GREEN">
          <shadow type="math_number">
            <field name="NUM">50</field>
          </shadow>
        </value>
        <value name="BLUE">
          <shadow type="math_number">
            <field name="NUM">0</field>
          </shadow>
        </value>
      </block>
      <block type="colour_blend">
        <value name="COLOUR1">
          <shadow type="colour_picker">
            <field name="COLOUR">#ff0000</field>
          </shadow>
        </value>
        <value name="COLOUR2">
          <shadow type="colour_picker">
            <field name="COLOUR">#3333ff</field>
          </shadow>
        </value>
        <value name="RATIO">
          <shadow type="math_number">
            <field name="NUM">0.5</field>
          </shadow>
        </value>
      </block>
    </category>	
	<!--<category id="catFunctions" colour="290" custom="PROCEDURE" name="Functions"></category>-->
	<category name="Extra" categorystyle="colour_category">
		<block kind="block" type="promptString"></block>
		<block kind="block" type="promptInteger"></block>
		<block kind="block" type="promptDouble"></block>		
		<block kind="block" type="confirm"></block>
		<block kind="block" type="delay"></block>
		<block kind="block" type="writelog"></block>
		<block kind="block" type="getWindowWidth"></block>
		<block kind="block" type="getWindowHeight"></block>	
	</category>
  </xml>	
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.26.1/axios.min.js" ></script>  
  <script src="scripts/common.js"></script> 
  <script src="sprites/yzkgame.js"></script> 
  <script>
	  window.onload=async function(){
	    var loading = layer.load(0, {shade: false,time: 20000});
		
		await initGameAsync();
		await addScript("https://cdnjs.cloudflare.com/ajax/libs/blockly/8.0.0/blockly.min.js",true);
		await addScript("scripts/csharp.js",false);
		await addScript("scripts/csharp/colour.js",true);
		await addScript("scripts/csharp/logic.js",true);
		await addScript("scripts/csharp/loops.js",true);
		await addScript("scripts/csharp/math.js",true);
		await addScript("scripts/csharp/procedures.js",true);
		await addScript("scripts/csharp/text.js",true);
		await addScript("scripts/csharp/variables.js",true);
		await addScript("scripts/csharp/variables_dynamic.js",true);
		await addScript("scripts/extrablocks/tools.js",false);
		await addScript("scripts/extrablocks/date.js",false);
		await addScript("scripts/extrablocks/yzkgameblocks.js",false);
		await addScript("scripts/strongtyping/blocks.js",false);
		await addScript("scripts/extrablocks/extra_math.js",false);
		await addScript("scripts/main.js",false);
		await addScript("scripts/FileSaver.js",true);		
		layer.close(loading);
	  }
  </script>
</body>
</html>

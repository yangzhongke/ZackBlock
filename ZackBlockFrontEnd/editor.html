<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Online C# IDE-Zack Yang</title>
	<link rel="stylesheet" href="https://code.getmdl.io/1.2.1/material.indigo-pink.min.css">
	<script src="./layui/layui.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/vue/2.6.7/vue.min.js"></script>
	<link rel="stylesheet" href="./layui/css/layui.css">
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/ace.min.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/mode-csharp.min.js" ></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/snippets/csharp.min.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/theme-monokai.min.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/ext-language_tools.min.js"></script>
	<script src="_framework/blazor.webassembly.js" autostart="false"></script>
	<script src="scripts/webcsc.js"></script>
	<script src="scripts/IDE.js"></script>
	<style type="text/css" media="screen">
		#editor { 
			position: absolute;
			top: 30px;
			right: 30vw;
			bottom: 0;
			left: 0;
		}
		#diagnostics
		{
			position: absolute;
			top: 30px;
			right: 0;
			width:30vw;
			bottom: 0;
			left: 70vw;
			font-size:x-small;
		}
	</style>	
</head>
<body>
	<div style="height:30px">
		<button id="btnRun">Run</button>
	</div>	
	<div id="editor"></div>	
	<table class="layui-table" id="diagnostics">
	  <colgroup>
		<col/><col/>
	  </colgroup>
	  <thead>
		<tr>
		  <th>Description</th>
		  <th>Line</th>
		</tr> 
	  </thead>
	  <tbody id="diagnosticsBody">
		<tr v-for="e in diagnostics" v-on:click="gotoDiagnostic(e)">>
		  <td>{{e.message}}</td>
		  <td>{{e.startLineNumber}}</td>
		</tr>
	  </tbody>
	</table>	
  <script>
	const editor = ace.edit("editor");
	editor.setTheme("ace/theme/monokai");
	editor.session.setMode("ace/mode/csharp");
	editor.setHighlightActiveLine(true);
	const autoCompWords =[ 
		{value: 'int', score: 10},
        {value: 'string', score: 10},
		{value: 'long', score: 10},
		{value: 'double', score: 10},
		{value: 'bool', score: 10},
		{value: 'float', score: 10},
		{value: 'DateTime', score: 10},
		{value: 'Console', score: 9},
        {value: 'ReadLine', score: 9},
		{value: 'WriteLine', score: 9},
		{value: 'Convert', score: 9},
		{value: 'ToString', score: 8},
		{value: 'ToInt32', score: 8},
		{value: 'ToDouble', score: 8},
		{value: 'ReadKey', score: 8},
		{value: 'ToInt64', score: 8},
		{value: 'ToDateTime', score: 8},
	]; 
	editor.setOptions({
	  enableBasicAutocompletion: [{
		getCompletions: (editor, session, pos, prefix, callback) => {
		  callback(null, autoCompWords);
		},
	  }],
	  // to make popup appear automatically, without explicit _ctrl+space_
	  enableLiveAutocompletion: true,
	});	
	const prevCode = localStorage.getItem("editor_savedCode");
	if(prevCode)
	{
		editor.session.setValue(prevCode);
	}
	else
	{
		editor.session.setValue('// See https://aka.ms/new-console-template for more information\r\nConsole.WriteLine("Hello, World!");\r\n');
	}
	var app = new Vue({
		el: '#diagnostics',
		data:
		{
			diagnostics:[],
		},
		methods:
		{
			gotoDiagnostic: function (e) 
			{
				//todo
			},
			showDiagnostics:function(diagnostics)
			{
				this.diagnostics=diagnostics;
			}
		}
	});	
	const codeChanged=function()
	{
		const code = editor.getValue();
		localStorage.setItem("editor_savedCode",code);	
	}
	let codeChangedTimeoutId;
	editor.on('change', function() {
		//fire codeChanged on Idle
		if(codeChangedTimeoutId)//clear the the unfired event
		{
			clearTimeout(codeChangedTimeoutId);
		}
		codeChangedTimeoutId = setTimeout(codeChanged,5000);
	});
	const btnRun = document.getElementById('btnRun');
	btnRun.onclick=async function()
	{
		btnRun.disabled=true;
		try
		{
			const code = editor.getValue();
			await webcsc.ensureStarted();
			const r = await IDE.csharp.runCode(code);
			if(!r) return;
			if (r.success)
			{
				app.showDiagnostics([]);
			}
			else
			{
				const errors = r.diagnostics.filter(e=>e.severity=='Error');
				app.showDiagnostics(errors);
			}		
		}
		finally
		{
			btnRun.disabled=false;
		}		
	}
  </script>
</body>
</html>

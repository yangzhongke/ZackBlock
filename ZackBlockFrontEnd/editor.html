<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Online C# IDE-Zack Yang</title>
	<link rel="stylesheet" href="https://code.getmdl.io/1.2.1/material.indigo-pink.min.css">
	<script src="./layui/layui.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/vue/2.6.7/vue.min.js"></script>
	<link rel="stylesheet" href="./layui/css/layui.css">
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/ace.min.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/mode-csharp.min.js" ></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/snippets/csharp.min.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/ace/1.14.0/theme-monokai.min.js"></script>
	<script src="_framework/blazor.webassembly.js" autostart="false"></script>
	<script src="scripts/webcsc.js"></script>  	
	<style type="text/css" media="screen">
		#editor { 
			position: absolute;
			top: 30px;
			right: 30vw;
			bottom: 0;
			left: 0;
		}
		#diagnostics
		{
			position: absolute;
			top: 30px;
			right: 0;
			width:30vw;
			bottom: 0;
			left: 70vw;
			font-size:x-small;
		}
	</style>	
</head>
<body>
	<div style="height:30px">
		<input id="btnRun" type="button" value="Run"/>	
	</div>	
	<div id="editor"></div>	
	<table class="layui-table" id="diagnostics">
	  <colgroup>
		<col/><col/>
	  </colgroup>
	  <thead>
		<tr>
		  <th>Description</th>
		  <th>Line</th>
		</tr> 
	  </thead>
	  <tbody id="diagnosticsBody">
		<tr v-for="e in diagnostics" v-on:click="gotoDiagnostic(e)">>
		  <td>{{e.message}}</td>
		  <td>{{e.startLineNumber}}</td>
		</tr>
	  </tbody>
	</table>	
  <script>
	const editor = ace.edit("editor");
	editor.setTheme("ace/theme/monokai");
	editor.session.setMode("ace/mode/csharp");
	editor.setHighlightActiveLine(true);
	const prevCode = localStorage.getItem("editor_savedCode");
	if(prevCode)
	{
		editor.session.setValue(prevCode);
	}
	var app = new Vue({
		el: '#diagnostics',
		data:
		{
			diagnostics:[],
		},
		methods:
		{
			gotoDiagnostic: function (e) 
			{
				//todo
			},
			showDiagnostics:function(diagnostics)
			{
				this.diagnostics=diagnostics;
			}
		}
	});		
	async function checkCode(code)
	{
		await webcsc.ensureStarted();
		var r = await webcsc.check(code);
		if (r.success)
		{
			app.showDiagnostics([]);
		}
		else
		{
			const errors = r.diagnostics.filter(e=>e.severity=='Error');
			app.showDiagnostics(errors);
		}
	}
	const codeChanged=function()
	{
		const code = editor.getValue();
		localStorage.setItem("editor_savedCode",code);	
		checkCode(code);
	}
	let codeChangedTimeoutId;
	editor.on('change', function() {
		//fire codeChanged on Idle
		if(codeChangedTimeoutId)//clear the the unfired event
		{
			clearTimeout(codeChangedTimeoutId);
		}
		codeChangedTimeoutId = setTimeout(codeChanged,2000);
	});
	var btnRun = document.getElementById('btnRun');
	btnRun.onclick=function()
	{
		const code = editor.getValue();
		layer.open({type: 2,content: 'gameplayer.html?'+new Date(),
			title:"Run", fixed: false,maxmin: true,area: ['80vw', '80vh'],
			success: function(dom, index){
				var framePlayer = window['layui-layer-iframe' + index];
				framePlayer.postMessage({mode:"C#",code:code});
			}	  
		});			
	}
  </script>
</body>
</html>

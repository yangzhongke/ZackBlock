<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
	body {    
		margin: 0 !important;
		padding: 0 !important;
		overflow-x: hidden;
		overflow-y: hidden;		
	}  
	canvas{
		margin: 0 !important;
		padding: 0 !important;
	}
  </style>
</head>
<body>
	<div>
		<div id="loadingDiv"><img src="images/loading.gif" /></div>
		<div>
			<canvas id="canvas" style="position:absolute;z-index:-1;" />
		</div>
	</div>  
  <script src="node_modules/axios/dist/axios.min.js"></script>   
  <script src="sprites/yzkgame.js"></script> 
  <script src="_framework/blazor.webassembly.js" autostart="false"></script>
  <script src="scripts/webcsc.js"></script>  
  <script>  
    var resizeCanvas=function(){
		var canvas = document.getElementById("canvas");		
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
	}
	window.addEventListener("resize", resizeCanvas); 
	window.addEventListener("load", resizeCanvas); 	
	window.addEventListener('message', onRecvMessage,false);  
	async function onRecvMessage(e)
	{	
		const mode = e.data.mode;
		const code = e.data.code;
		await initGameAsync();
		await loadGameAsync(canvas);
		clearGame();
				
		if(mode=="C#")
		{			
			await runCSharpCode(code)
		}
		else
		{
			hideLoading();
			//to make hideLoading() works immediately, runXXCode() should be run after an delay(0), which means setTimeout(0);
			await delay(0);
			await runJSCode(code);
		}				
	}
	function delay(ms)
	{
		return new Promise(resolve => setTimeout(resolve, ms));
	}
	function hideLoading()
	{
		document.getElementById("loadingDiv").style.display="none";	
	}
	function closeMe()
	{
		const index = parent.layer.getFrameIndex(window.name);
		parent.layer.close(index);
	}
	
	async function runCSharpCode(code)
	{
		try
		{			
			await webcsc.ensureStarted();
			hideLoading();
			await delay(0);
			await webcsc.run(code);
			closeMe();
		}
		catch(err)
		{
			console.error(err);
			alert("Error: "+err);
		}
	}
	
	function runJSCode(code)
	{
		try
		{			
			//there may be 'await' in code,
			//so async is needed.
			eval("(async () => {" + code + "\r\ncloseMe();})()");			
		}
		catch(err)
		{
			console.error(err);
			alert("Error: "+err);
		}
	}
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
	body {    
		margin: 0 !important;
		padding: 0 !important;
		overflow-x: hidden;
		overflow-y: hidden;		
	}  
	canvas{
		margin: 0 !important;
		padding: 0 !important;
	}
  </style>
</head>
<body>
	<div>
		<div style="position:absolute;top:0;left:0;z-index:99999;" id="loadingDiv">Loading</div>
		<div>
			<canvas id="canvas" style="position:absolute;z-index:-1;">
		</div>
	</div>  
  <script src="node_modules/axios/dist/axios.min.js"></script>   
  <script src="sprites/yzkgame.js"></script> 
  <script>
    var resizeCanvas=function(){
		var canvas = document.getElementById("canvas");		
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
	}
	window.addEventListener("resize", resizeCanvas); 
	window.addEventListener("load", resizeCanvas); 	
	window.addEventListener('message', onRecvMessage,false);  
	async function onRecvMessage(e)
	{	
		await initGameAsync();
		await loadGameAsync(canvas);
		document.getElementById("loadingDiv").style.display="none";
		var code = e.data;
		runCode(code);		
	}
	function runCode(code)
	{
		try
		{
			eval(code);
		}
		catch(err)
		{
			console.error(err);
			alert("Error: "+err);
		}	
	}
  </script>
</body>
</html>
